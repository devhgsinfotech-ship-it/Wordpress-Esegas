services:

  mysql:
    image: mysql:8.0
    container_name: wordpress_local_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf

    networks:
      - wordpress_network


  redis:
    image: redis:7-alpine
    container_name: wordpress_local_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - wordpress_network


  wordpress:
    image: wordpress:php8.2-apache
    container_name: wordpress_local
    restart: unless-stopped

    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', true );
        @ini_set( 'display_errors', 0 );
        define( 'WP_MEMORY_LIMIT', '512M' );
        define( 'WP_MAX_MEMORY_LIMIT', '512M' );
        define( 'WP_POST_REVISIONS', 5 );
        define( 'AUTOSAVE_INTERVAL', 300 );
        define( 'EMPTY_TRASH_DAYS', 7 );
        define( 'WP_CRON_LOCK_TIMEOUT', 60 );
        define( 'DISABLE_WP_CRON', true );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
        define( 'WP_AUTO_UPDATE_CORE', false );
        define( 'WP_HTTP_BLOCK_EXTERNAL', false );
        define( 'WP_ACCESSIBLE_HOSTS', 'api.wordpress.org,*.wordpress.org,downloads.wordpress.org' );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_REDIS_HOST', 'redis' );
        define( 'WP_REDIS_PORT', 6379 );

    ports:
      - "${WORDPRESS_PORT}:80"

    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini

    depends_on:
      - mysql
      - redis

    networks:
      - wordpress_network


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wordpress_local_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "8091:80"

    depends_on:
      - mysql

    networks:
      - wordpress_network


  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: wordpress_nextjs
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - WORDPRESS_INTERNAL_URL=http://wordpress
      - NEXT_PUBLIC_WORDPRESS_URL=http://localhost:8090
      - PORT=3000
    volumes:
      - ./frontend:/app
      - nextjs_node_modules:/app/node_modules
    depends_on:
      - wordpress
    networks:
      - wordpress_network


networks:
  wordpress_network:
    driver: bridge


volumes:
  mysql_data:
    driver: local

  wordpress_data:
    driver: local

  nextjs_node_modules:
    driver: local